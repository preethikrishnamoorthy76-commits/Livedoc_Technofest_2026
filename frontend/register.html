<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveDoc AI - Register</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

    <header class="header">
        <h2>LiveDoc AI</h2>
    </header>

    <main class="container">

        <div class="hero"></div>

        <div class="title-section">
            <h1>Create Account</h1>
            <p>Register to start using LiveDoc AI</p>
        </div>

        <form id="registerForm" class="form">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>

                <div class="password-box">
                    <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>
                    <button type="button" id="togglePassword">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>

                <div class="password-box">
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" minlength="8" required>
                    <button type="button" id="toggleConfirmPassword">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">Create Account</button>

            <button type="button" id="backToLogin" class="register-btn">Back to Login</button>

        </form>

    </main>

    <script src="register.js"></script>

</body>

</html>
